<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Withdraw - RND Rewards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 10px 20px; border-radius: 50px; cursor: pointer; }
        .withdraw-card { background: white; border-radius: 30px; padding: 30px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3); }
        .balance-show { background: linear-gradient(135deg, #667eea20, #764ba220); padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 25px; }
        .balance-show h3 { font-size: 28px; color: #667eea; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #374151; }
        .form-group input, .form-group select { width: 100%; padding: 14px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .withdraw-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 15px; font-weight: 600; cursor: pointer; font-size: 16px; }
        .withdraw-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .info-text { font-size: 12px; color: #6b7280; text-align: center; margin-top: 20px; }
        .task-warning { background: #fef3c7; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
        .task-success { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
        .message { margin-top: 15px; padding: 12px; border-radius: 12px; text-align: center; }
        .error { background: #fee2e2; color: #dc2626; }
        .address-hint { font-size: 12px; color: #6b7280; margin-top: 5px; }
        
        /* Withdrawal Status Section */
        .withdrawal-status {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 15px;
            margin-top: 20px;
            border: 1px solid #e5e7eb;
        }
        .withdrawal-status h4 {
            font-size: 14px;
            margin-bottom: 12px;
            color: #374151;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-item {
            background: white;
            border-radius: 12px;
            padding: 12px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-left: 4px solid #667eea;
        }
        .status-item .amount {
            font-weight: bold;
            color: #059669;
        }
        .status-pending-badge {
            background: #fef3c7;
            color: #d97706;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-completed-badge {
            background: #d1fae5;
            color: #059669;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-rejected-badge {
            background: #fee2e2;
            color: #dc2626;
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        .status-date {
            font-size: 10px;
            color: #9ca3af;
            margin-top: 5px;
        }
        .no-withdrawal {
            text-align: center;
            padding: 20px;
            color: #9ca3af;
            font-size: 13px;
        }
        
        /* Toast Message Style */
        .toast-message {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1f2937;
            color: white;
            padding: 18px 22px;
            border-radius: 20px;
            max-width: 90%;
            width: 420px;
            z-index: 1000;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.3);
            animation: slideUp 0.3s ease-out;
            text-align: left;
        }
        .toast-success { border-left: 5px solid #10b981; }
        .toast-warning { border-left: 5px solid #f59e0b; }
        .toast-message i { margin-right: 12px; font-size: 22px; vertical-align: middle; }
        .toast-message .toast-title { font-weight: 700; margin-bottom: 8px; font-size: 16px; }
        .toast-message .toast-desc { font-size: 13px; opacity: 0.9; line-height: 1.5; }
        .toast-message .toast-close {
            position: absolute;
            top: 12px;
            right: 15px;
            cursor: pointer;
            font-size: 18px;
            opacity: 0.7;
        }
        @keyframes slideUp {
            from { bottom: -100px; opacity: 0; }
            to { bottom: 30px; opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="color:white;"><i class="fas fa-hand-holding-usd"></i> Withdraw</h2>
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        <div class="withdraw-card">
            <div class="balance-show">
                <i class="fas fa-wallet"></i> <span id="walletLabel">Referral Wallet</span>
                <h3 id="walletBalance">0</h3>
            </div>
            <div id="taskWarning" class="task-warning" style="display:none;">
                <i class="fas fa-exclamation-triangle"></i> <span id="warningText">Complete all social tasks first!</span>
            </div>
            <div id="taskSuccess" class="task-success" style="display:none;">
                <i class="fas fa-check-circle"></i> <span>✅ Social tasks completed! You are eligible for withdrawal.</span>
            </div>
            <form id="withdrawForm">
                <div class="form-group">
                    <label><i class="fas fa-credit-card"></i> Select Wallet</label>
                    <select id="walletType">
                        <option value="referralWallet">Referral Wallet</option>
                        <option value="spinWallet">Spin Wallet</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-coins"></i> Amount (Only 1 RND allowed)</label>
                    <input type="number" id="amount" placeholder="Enter 1" min="1" max="1" step="1" value="1">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-link"></i> RND BEP20 Wallet Address</label>
                    <input type="text" id="address" placeholder="0x... (RND BEP20 address)">
                    <div class="address-hint"><i class="fas fa-info-circle"></i> Please enter your valid RND BEP20 wallet address</div>
                </div>
                <button type="submit" id="withdrawBtn" class="withdraw-btn"><i class="fas fa-paper-plane"></i> Request Withdrawal (1 RND)</button>
            </form>
            <div class="info-text"><i class="fas fa-clock"></i> Withdrawal will be processed within 2-3 working days</div>
            <div id="message" class="message"></div>
            
            <!-- Withdrawal Status Section -->
            <div class="withdrawal-status" id="withdrawalStatusSection">
                <h4><i class="fas fa-history"></i> Your Withdrawal Status</h4>
                <div id="withdrawalStatusList">
                    <div class="no-withdrawal">
                        <i class="fas fa-clock"></i> No withdrawal requests yet
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, update, push, set, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARtuToUfDsK6EOrqpJ6nBpfSHx2JobWhQ",
            authDomain: "randigital-e7715.firebaseapp.com",
            databaseURL: "https://randigital-e7715-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "randigital-e7715",
            storageBucket: "randigital-e7715.firebasestorage.app",
            messagingSenderId: "218883279353",
            appId: "1:218883279353:web:cda990aa068f8fdf4d1528"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentUser = null, userData = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            await loadUserData();
            await loadUserWithdrawals();
        });

        async function loadUserData() {
            const snap = await get(ref(db, 'users/' + currentUser.uid));
            userData = snap.val();
            if (!userData) userData = { spinWallet: 0, referralWallet: 0, socialTasks: {} };
            if (!userData.socialTasks) userData.socialTasks = {};
            updateBalanceDisplay();
            checkTasks();
        }

        // Load user's withdrawal requests
        async function loadUserWithdrawals() {
            try {
                const withdrawalsRef = ref(db, 'withdrawals');
                const userWithdrawalsQuery = query(withdrawalsRef, orderByChild('uid'), equalTo(currentUser.uid));
                const snapshot = await get(userWithdrawalsQuery);
                const withdrawals = [];
                
                snapshot.forEach((childSnap) => {
                    withdrawals.push({
                        id: childSnap.key,
                        ...childSnap.val()
                    });
                });
                
                // Sort by date (newest first)
                withdrawals.sort((a, b) => new Date(b.date) - new Date(a.date));
                displayWithdrawalStatus(withdrawals);
            } catch (error) {
                console.error("Error loading withdrawals:", error);
            }
        }

        function displayWithdrawalStatus(withdrawals) {
            const container = document.getElementById('withdrawalStatusList');
            if (!container) return;
            
            if (withdrawals.length === 0) {
                container.innerHTML = '<div class="no-withdrawal"><i class="fas fa-clock"></i> No withdrawal requests yet</div>';
                return;
            }
            
            container.innerHTML = '';
            withdrawals.forEach((wd) => {
                const statusClass = wd.status === 'pending' ? 'status-pending-badge' : 
                                   (wd.status === 'completed' ? 'status-completed-badge' : 'status-rejected-badge');
                const statusText = wd.status === 'pending' ? '⏳ Pending' : 
                                  (wd.status === 'completed' ? '✅ Completed' : '❌ Rejected');
                const statusIcon = wd.status === 'pending' ? 'fa-clock' : 
                                  (wd.status === 'completed' ? 'fa-check-circle' : 'fa-times-circle');
                
                const div = document.createElement('div');
                div.className = 'status-item';
                div.innerHTML = `
                    <div>
                        <div class="amount">${wd.amount} RND</div>
                        <div class="status-date"><i class="far fa-calendar-alt"></i> ${new Date(wd.date).toLocaleString('hi-IN')}</div>
                    </div>
                    <div>
                        <span class="${statusClass}"><i class="fas ${statusIcon}"></i> ${statusText}</span>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        function updateBalanceDisplay() {
            const walletType = document.getElementById('walletType').value;
            let balance = walletType === 'referralWallet' ? (userData.referralWallet || 0) : (userData.spinWallet || 0);
            document.getElementById('walletBalance').innerText = balance;
            document.getElementById('walletLabel').innerText = walletType === 'referralWallet' ? 'Referral Wallet' : 'Spin Wallet';
        }

        function checkTasks() {
            const tasks = userData?.socialTasks || {};
            const allDone = tasks.facebook === true && tasks.twitter === true;
            
            const warningDiv = document.getElementById('taskWarning');
            const successDiv = document.getElementById('taskSuccess');
            
            if (!allDone) {
                warningDiv.style.display = 'flex';
                successDiv.style.display = 'none';
                document.getElementById('warningText').innerHTML = '⚠️ You must complete Facebook & Twitter tasks before withdrawing! Each task gives +3 RND.';
            } else {
                warningDiv.style.display = 'none';
                successDiv.style.display = 'flex';
            }
        }

        function removeExistingToast() {
            const existingToast = document.querySelector('.toast-message');
            if (existingToast) existingToast.remove();
        }

        function showSuccessToast() {
            removeExistingToast();
            
            const toast = document.createElement('div');
            toast.className = 'toast-message toast-success';
            toast.innerHTML = `
                <span class="toast-close" onclick="this.parentElement.remove();">&times;</span>
                <div>
                    <div class="toast-title">✅ Withdrawal Request Successful!</div>
                    <div class="toast-desc">
                        आपकी Withdrawal Request सफलतापूर्वक प्राप्त हो गई है।<br>
                        2 से 3 दिनों के अंदर आपका Withdrawal प्रोसेस कर दिया जाएगा।
                    </div>
                </div>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                if (toast) toast.remove();
            }, 8000);
        }

        function showWarningToast() {
            removeExistingToast();
            
            const toast = document.createElement('div');
            toast.className = 'toast-message toast-warning';
            toast.innerHTML = `
                <span class="toast-close" onclick="this.parentElement.remove();">&times;</span>
                <div>
                    <div class="toast-title">⚠️ अभी Withdrawal उपलब्ध नहीं है</div>
                    <div class="toast-desc">
                        RND Coin को जल्द ही बड़े Official Exchange पर List किया जाएगा।<br><br>
                        Listing के बाद आप अपना पूरा Withdrawal आसानी से कर सकेंगे।<br><br>
                        तब तक <strong>Refer</strong> करके कमाई करें, <strong>Spin</strong> करके RND Coins अर्जित करें और अपनी Income को बढ़ाएँ।<br><br>
                        आपके सहयोग के लिए धन्यवाद।
                    </div>
                </div>
            `;
            document.body.appendChild(toast);
            
            setTimeout(() => {
                if (toast) toast.remove();
            }, 10000);
        }

        async function hasUserWithdrawnBefore() {
            const withdrawalsRef = ref(db, 'withdrawals');
            const userWithdrawalsQuery = query(withdrawalsRef, orderByChild('uid'), equalTo(currentUser.uid));
            const snapshot = await get(userWithdrawalsQuery);
            let withdrawn = false;
            
            snapshot.forEach((childSnap) => {
                const data = childSnap.val();
                if (data.status !== 'cancelled' && data.status !== 'rejected') {
                    withdrawn = true;
                }
            });
            
            return withdrawn;
        }

        document.getElementById('walletType').addEventListener('change', () => updateBalanceDisplay());

        document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const walletType = document.getElementById('walletType').value;
            const amount = parseInt(document.getElementById('amount').value);
            const address = document.getElementById('address').value;
            const msgDiv = document.getElementById('message');
            
            const tasks = userData?.socialTasks || {};
            const allTasksDone = tasks.facebook === true && tasks.twitter === true;

            msgDiv.innerHTML = '';

            if (!allTasksDone) {
                msgDiv.innerHTML = '<div class="error">❌ Complete Facebook & Twitter tasks first! Each gives +3 RND.</div>';
                return;
            }

            if (amount !== 1) {
                msgDiv.innerHTML = '<div class="error">❌ You can withdraw only 1 RND at a time.</div>';
                return;
            }

            if (!address) {
                msgDiv.innerHTML = '<div class="error">❌ Please enter your RND BEP20 wallet address!</div>';
                return;
            }

            if (!address.startsWith('0x') || address.length !== 42) {
                msgDiv.innerHTML = '<div class="error">❌ Please enter a valid BEP20 wallet address (0x... 42 characters).</div>';
                return;
            }

            const currentBal = userData[walletType] || 0;
            if (currentBal < amount) {
                msgDiv.innerHTML = '<div class="error">❌ Insufficient balance! You need at least 1 RND in this wallet.</div>';
                return;
            }

            const alreadyWithdrawn = await hasUserWithdrawnBefore();
            
            if (alreadyWithdrawn) {
                showWarningToast();
                return;
            }

            try {
                const updatedBal = currentBal - amount;
                await update(ref(db, 'users/' + currentUser.uid), {
                    [walletType]: updatedBal
                });

                const withdrawRef = push(ref(db, 'withdrawals'));
                await set(withdrawRef, {
                    uid: currentUser.uid,
                    walletType: walletType,
                    amount: amount,
                    walletAddress: address,
                    status: 'pending',
                    date: new Date().toISOString()
                });

                userData[walletType] = updatedBal;
                updateBalanceDisplay();

                document.getElementById('address').value = '';
                msgDiv.innerHTML = '';

                showSuccessToast();
                
                // Reload withdrawals to show new status
                await loadUserWithdrawals();

            } catch (error) {
                console.error("Error:", error);
                msgDiv.innerHTML = '<div class="error">❌ Something went wrong! Please try again.</div>';
            }
        });

        window.goBack = function() {
            window.location.href = 'dashboard.html';
        };
    </script>
</body>
</html>
