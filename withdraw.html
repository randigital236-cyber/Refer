<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Withdraw - RND Rewards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 10px 20px; border-radius: 50px; cursor: pointer; }
        .withdraw-card { background: white; border-radius: 30px; padding: 30px; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3); }
        .balance-show { background: linear-gradient(135deg, #667eea20, #764ba220); padding: 15px; border-radius: 15px; text-align: center; margin-bottom: 25px; }
        .balance-show h3 { font-size: 28px; color: #667eea; }
        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: #374151; }
        .form-group input, .form-group select { width: 100%; padding: 14px; border: 2px solid #e5e7eb; border-radius: 12px; font-size: 14px; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .withdraw-btn { width: 100%; padding: 16px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 15px; font-weight: 600; cursor: pointer; font-size: 16px; }
        .info-text { font-size: 12px; color: #6b7280; text-align: center; margin-top: 20px; }
        .task-warning { background: #fef3c7; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
        .task-success { background: #d1fae5; color: #065f46; padding: 12px; border-radius: 12px; margin-bottom: 20px; font-size: 13px; display: flex; align-items: center; gap: 10px; }
        .message { margin-top: 15px; padding: 12px; border-radius: 12px; text-align: center; }
        .error { background: #fee2e2; color: #dc2626; }
        .success { background: #d1fae5; color: #059669; }
        .lock-message { background: #fef3c7; color: #b45309; }
        .address-hint { font-size: 12px; color: #6b7280; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="color:white;"><i class="fas fa-hand-holding-usd"></i> Withdraw</h2>
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        <div class="withdraw-card">
            <div class="balance-show">
                <i class="fas fa-wallet"></i> <span id="walletLabel">Referral Wallet</span>
                <h3 id="walletBalance">0</h3>
            </div>
            <div id="taskWarning" class="task-warning" style="display:none;">
                <i class="fas fa-exclamation-triangle"></i> <span id="warningText">Complete all social tasks first!</span>
            </div>
            <div id="taskSuccess" class="task-success" style="display:none;">
                <i class="fas fa-check-circle"></i> <span>✅ Social tasks completed! You are eligible for withdrawal.</span>
            </div>
            <form id="withdrawForm">
                <div class="form-group">
                    <label><i class="fas fa-credit-card"></i> Select Wallet</label>
                    <select id="walletType">
                        <option value="referralWallet">Referral Wallet</option>
                        <option value="spinWallet">Spin Wallet</option>
                    </select>
                </div>
                <div class="form-group">
                    <label><i class="fas fa-coins"></i> Amount (Only 1 RND allowed)</label>
                    <input type="number" id="amount" placeholder="Enter 1" min="1" max="1" step="1" value="1">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-link"></i> RND BEP20 Wallet Address</label>
                    <input type="text" id="address" placeholder="0x... (RND BEP20 address)">
                    <div class="address-hint"><i class="fas fa-info-circle"></i> Please enter your valid RND BEP20 wallet address</div>
                </div>
                <button type="submit" class="withdraw-btn"><i class="fas fa-paper-plane"></i> Request Withdrawal (1 RND)</button>
            </form>
            <div class="info-text"><i class="fas fa-clock"></i> Withdrawals processed within 24-48 hours</div>
            <div id="message" class="message"></div>
        </div>
    </div>
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, update, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARtuToUfDsK6EOrqpJ6nBpfSHx2JobWhQ",
            authDomain: "randigital-e7715.firebaseapp.com",
            databaseURL: "https://randigital-e7715-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "randigital-e7715",
            storageBucket: "randigital-e7715.firebasestorage.app",
            messagingSenderId: "218883279353",
            appId: "1:218883279353:web:cda990aa068f8fdf4d1528"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        let currentUser = null, userData = null;

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            await loadUserData();
        });

        async function loadUserData() {
            const snap = await get(ref(db, 'users/' + currentUser.uid));
            userData = snap.val();
            if (!userData) userData = { spinWallet: 0, referralWallet: 0, socialTasks: {} };
            if (!userData.socialTasks) userData.socialTasks = {};
            updateBalanceDisplay();
            checkTasks();
        }

        function updateBalanceDisplay() {
            const walletType = document.getElementById('walletType').value;
            let balance = walletType === 'referralWallet' ? (userData.referralWallet || 0) : (userData.spinWallet || 0);
            document.getElementById('walletBalance').innerText = balance;
            document.getElementById('walletLabel').innerText = walletType === 'referralWallet' ? 'Referral Wallet' : 'Spin Wallet';
        }

        function checkTasks() {
            // Only check Facebook and Twitter (NOT Instagram & Telegram)
            const tasks = userData?.socialTasks || {};
            const allDone = tasks.facebook === true && tasks.twitter === true;
            
            const warningDiv = document.getElementById('taskWarning');
            const successDiv = document.getElementById('taskSuccess');
            
            if (!allDone) {
                warningDiv.style.display = 'flex';
                successDiv.style.display = 'none';
                document.getElementById('warningText').innerHTML = '⚠️ You must complete Facebook & Twitter tasks before withdrawing! Each task gives +3 RND.';
            } else {
                warningDiv.style.display = 'none';
                successDiv.style.display = 'flex';
            }
        }

        document.getElementById('walletType').addEventListener('change', () => updateBalanceDisplay());

        document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const walletType = document.getElementById('walletType').value;
            const amount = parseInt(document.getElementById('amount').value);
            const address = document.getElementById('address').value;
            const msgDiv = document.getElementById('message');
            
            // Only check Facebook and Twitter
            const tasks = userData?.socialTasks || {};
            const allTasksDone = tasks.facebook === true && tasks.twitter === true;

            msgDiv.innerHTML = '';

            if (!allTasksDone) {
                msgDiv.innerHTML = '<div class="error">❌ Complete Facebook & Twitter tasks first! Each gives +3 RND.</div>';
                return;
            }

            if (amount !== 1) {
                msgDiv.innerHTML = '<div class="error">❌ You can withdraw only 1 RND at a time. Please enter exactly 1 RND.</div>';
                return;
            }

            if (!address) {
                msgDiv.innerHTML = '<div class="error">❌ Please enter your RND BEP20 wallet address!</div>';
                return;
            }

            if (!address.startsWith('0x') || address.length !== 42) {
                msgDiv.innerHTML = '<div class="error">❌ Please enter a valid BEP20 wallet address (0x... 42 characters).</div>';
                return;
            }

            const currentBal = userData[walletType] || 0;
            if (currentBal < amount) {
                msgDiv.innerHTML = '<div class="error">❌ Insufficient balance! You need at least 1 RND in this wallet.</div>';
                return;
            }

            // Check if user has already withdrawn once
            const withdrawSnap = await get(ref(db, 'withdrawals'));
            let userWithdrawals = [];
            withdrawSnap.forEach((childSnap) => {
                const data = childSnap.val();
                if (data.uid === currentUser.uid) {
                    userWithdrawals.push(data);
                }
            });

            if (userWithdrawals.length >= 1) {
                msgDiv.innerHTML = `<div class="error lock-message">
                    <i class="fas fa-lock"></i> ⚠️ Withdrawal is locked until the official listing.  
                    You have already withdrawn 1 RND. Next withdrawal will be available after the listing announcement.  
                    Keep referring, spinning, and earning until then.
                </div>`;
                return;
            }

            // Deduct balance
            const updatedBal = currentBal - amount;
            await update(ref(db, 'users/' + currentUser.uid), {
                [walletType]: updatedBal
            });

            const withdrawRef = push(ref(db, 'withdrawals'));
            await set(withdrawRef, {
                uid: currentUser.uid,
                walletType,
                amount,
                walletAddress: address,
                status: 'pending',
                date: new Date().toISOString()
            });

            msgDiv.innerHTML = '<div class="success">✅ Withdrawal request submitted successfully! You will receive 1 RND in your BEP20 wallet after listing.</div>';
            document.getElementById('amount').value = '1';
            document.getElementById('address').value = '';

            await loadUserData();
        });

        window.goBack = function() {
            window.location.href = 'dashboard.html';
        };
    </script>
</body>
</html>
