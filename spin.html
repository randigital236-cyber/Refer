<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spin Wheel - RND Rewards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-size: 14px; }
        .spin-card { background: white; border-radius: 40px; padding: 40px 30px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3); }
        .balance-badge { background: linear-gradient(135deg, #667eea20, #764ba220); padding: 10px 20px; border-radius: 50px; display: inline-block; margin-bottom: 20px; font-weight: 500; }
        .timer-badge { background: #fef3c7; padding: 10px 20px; border-radius: 50px; display: inline-block; margin-bottom: 15px; color: #92400e; font-size: 14px; }
        .wheel-container { margin: 30px 0; display: flex; justify-content: center; }
        .wheel { width: 280px; height: 280px; max-width: 100%; }
        .spin-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 18px 50px; border-radius: 50px; font-size: 20px; font-weight: bold; cursor: pointer; transition: transform 0.2s; margin-top: 20px; }
        .spin-btn:active { transform: scale(0.95); }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .prize-list { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .prize-badge { background: #f3f4f6; padding: 8px 15px; border-radius: 50px; font-size: 12px; }
        .result { margin-top: 20px; padding: 15px; border-radius: 15px; font-weight: bold; animation: fadeIn 0.5s; }
        .result.win { background: #d1fae5; color: #059669; }
        .result.lose { background: #fee2e2; color: #dc2626; }
        .timer-text { font-size: 16px; font-weight: bold; color: #dc2626; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 480px) { .wheel { width: 250px; height: 250px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="color:white;"><i class="fas fa-gamepad"></i> Spin & Earn</h2>
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        <div class="spin-card">
            <div class="balance-badge">
                <i class="fas fa-coins"></i> Your Spin Wallet: <strong id="spinWallet">0</strong> RND
            </div>
            <div id="timerBadge" class="timer-badge" style="display:none;">
                <i class="fas fa-hourglass-half"></i> Next Spin Available In: 
                <span id="countdownTimer" class="timer-text">--:--:--</span>
            </div>
            <div class="wheel-container">
                <canvas id="wheelCanvas" width="280" height="280" class="wheel"></canvas>
            </div>
            <button class="spin-btn" id="spinBtn">
                <i class="fas fa-sync-alt"></i> SPIN NOW
            </button>
            <div class="prize-list">
                <span class="prize-badge">🎁 0 RND</span>
                <span class="prize-badge">🎁 1 RND</span>
                <span class="prize-badge">🎁 2 RND</span>
                <span class="prize-badge">🎁 5 RND</span>
                <span class="prize-badge">🎁 10 RND</span>
            </div>
            <div id="resultMsg" class="result" style="display:none;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyARtuToUfDsK6EOrqpJ6nBpfSHx2JobWhQ",
            authDomain: "randigital-e7715.firebaseapp.com",
            databaseURL: "https://randigital-e7715-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "randigital-e7715",
            storageBucket: "randigital-e7715.firebasestorage.app",
            messagingSenderId: "218883279353",
            appId: "1:218883279353:web:cda990aa068f8fdf4d1528"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        let currentUser = null;
        let userData = null;
        let spinning = false;
        let countdownInterval = null;
        let animationFrameId = null;
        
        // Wheel segments - 6 equal segments
        const segments = [
            { label: '1 RND', value: 1, color: '#FF6B6B' },
            { label: '2 RND', value: 2, color: '#4ECDC4' },
            { label: '0 RND', value: 0, color: '#FFEAA7' },
            { label: '5 RND', value: 5, color: '#45B7D1' },
            { label: '2 RND', value: 2, color: '#96CEB4' },
            { label: '10 RND', value: 10, color: '#DDA0DD' }
        ];
        
        const canvas = document.getElementById('wheelCanvas');
        let ctx = null;
        
        // Initialize canvas context
        function initCanvas() {
            if (!canvas) return false;
            ctx = canvas.getContext('2d');
            if (!ctx) return false;
            return true;
        }
        
        // Draw wheel with rotation
        function drawWheel(rotationAngle = 0) {
            if (!ctx || !canvas) return;
            
            const w = canvas.width;
            const h = canvas.height;
            const centerX = w / 2;
            const centerY = h / 2;
            const radius = w / 2 - 10;
            
            ctx.clearRect(0, 0, w, h);
            
            const angleStep = (Math.PI * 2) / segments.length;
            
            for (let i = 0; i < segments.length; i++) {
                const start = i * angleStep + rotationAngle;
                const end = start + angleStep;
                
                // Draw segment
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, start, end);
                ctx.closePath();
                ctx.fillStyle = segments[i].color;
                ctx.fill();
                
                // Draw border
                ctx.strokeStyle = '#ffffff';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, start, end);
                ctx.closePath();
                ctx.stroke();
                
                // Draw text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(start + angleStep / 2);
                ctx.fillStyle = '#1f2937';
                ctx.font = 'bold 14px Poppins';
                ctx.shadowBlur = 0;
                ctx.fillText(segments[i].label, radius - 35, 8);
                ctx.restore();
            }
            
            // Draw center circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, Math.PI * 2);
            ctx.fillStyle = '#ffffff';
            ctx.fill();
            ctx.strokeStyle = '#667eea';
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Draw pointer
            ctx.beginPath();
            ctx.moveTo(centerX - 8, 15);
            ctx.lineTo(centerX, 5);
            ctx.lineTo(centerX + 8, 15);
            ctx.fillStyle = '#dc2626';
            ctx.fill();
        }
        
        // Initial draw
        if (initCanvas()) {
            drawWheel(0);
        }
        
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            await loadUserData();
        });
        
        async function loadUserData() {
            try {
                const userRef = ref(db, 'users/' + currentUser.uid);
                const snap = await get(userRef);
                userData = snap.val();
                if (!userData) {
                    userData = { spinWallet: 0, totalEarned: 0, lastSpinTime: 0 };
                }
                if (userData.lastSpinTime === undefined) {
                    userData.lastSpinTime = 0;
                }
                document.getElementById('spinWallet').innerText = userData.spinWallet || 0;
                checkAndUpdateTimer();
            } catch (error) {
                console.error("Error loading user data:", error);
            }
        }
        
        function checkAndUpdateTimer() {
            const lastSpinTime = userData.lastSpinTime || 0;
            const currentTime = Date.now();
            const cooldownMs = 8 * 60 * 60 * 1000; // 8 hours
            
            if (lastSpinTime > 0 && (currentTime - lastSpinTime) < cooldownMs) {
                const remainingMs = cooldownMs - (currentTime - lastSpinTime);
                startCountdownTimer(remainingMs);
                document.getElementById('spinBtn').disabled = true;
                document.getElementById('timerBadge').style.display = 'inline-block';
            } else {
                if (countdownInterval) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                }
                document.getElementById('spinBtn').disabled = false;
                document.getElementById('timerBadge').style.display = 'none';
            }
        }
        
        function startCountdownTimer(remainingMs) {
            if (countdownInterval) {
                clearInterval(countdownInterval);
            }
            
            let remaining = remainingMs;
            
            function updateDisplay() {
                if (remaining <= 0) {
                    clearInterval(countdownInterval);
                    countdownInterval = null;
                    document.getElementById('spinBtn').disabled = false;
                    document.getElementById('timerBadge').style.display = 'none';
                    return;
                }
                
                const hours = Math.floor(remaining / (60 * 60 * 1000));
                const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
                const seconds = Math.floor((remaining % (60 * 1000)) / 1000);
                
                const timerElement = document.getElementById('countdownTimer');
                if (timerElement) {
                    timerElement.innerHTML = `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                }
                
                remaining -= 1000;
            }
            
            updateDisplay();
            countdownInterval = setInterval(updateDisplay, 1000);
        }
        
        async function updateLastSpinTime() {
            const currentTime = Date.now();
            await update(ref(db, 'users/' + currentUser.uid), {
                lastSpinTime: currentTime
            });
            userData.lastSpinTime = currentTime;
        }
        
        function showResult(message, isWin) {
            const resultDiv = document.getElementById('resultMsg');
            resultDiv.style.display = 'block';
            resultDiv.className = isWin ? 'result win' : 'result lose';
            resultDiv.innerHTML = message;
            
            setTimeout(() => {
                resultDiv.style.display = 'none';
            }, 3000);
        }
        
        async function startSpin() {
            if (spinning) return;
            
            // Check cooldown
            const lastSpinTime = userData.lastSpinTime || 0;
            const currentTime = Date.now();
            const cooldownMs = 8 * 60 * 60 * 1000;
            
            if (lastSpinTime > 0 && (currentTime - lastSpinTime) < cooldownMs) {
                const remainingMs = cooldownMs - (currentTime - lastSpinTime);
                const hours = Math.floor(remainingMs / (60 * 60 * 1000));
                const minutes = Math.floor((remainingMs % (60 * 60 * 1000)) / (60 * 1000));
                const seconds = Math.floor((remainingMs % (60 * 1000)) / 1000);
                showResult(`⏰ आप ${hours} घंटे ${minutes} मिनट ${seconds} सेकंड बाद ही दोबारा Spin कर सकते हैं!`, false);
                return;
            }
            
            spinning = true;
            const spinBtn = document.getElementById('spinBtn');
            spinBtn.disabled = true;
            spinBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Spinning...';
            
            // Random prize
            const randomIndex = Math.floor(Math.random() * segments.length);
            const prize = segments[randomIndex];
            
            const spinDuration = 2500;
            const startTime = Date.now();
            const startRotation = 0;
            const totalSpins = 10; // Full rotations
            
            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(1, elapsed / spinDuration);
                
                // Easing function
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                // Calculate rotation
                const targetRotation = (totalSpins * Math.PI * 2) + (randomIndex * (Math.PI * 2 / segments.length));
                const currentRotation = startRotation + (targetRotation * easeOut);
                
                drawWheel(currentRotation % (Math.PI * 2));
                
                if (progress < 1) {
                    animationFrameId = requestAnimationFrame(animate);
                } else {
                    // Spin finished
                    drawWheel(randomIndex * (Math.PI * 2 / segments.length));
                    
                    // Update user balance
                    if (prize.value > 0) {
                        const newBalance = (userData.spinWallet || 0) + prize.value;
                        const newTotal = (userData.totalEarned || 0) + prize.value;
                        
                        try {
                            await update(ref(db, 'users/' + currentUser.uid), {
                                spinWallet: newBalance,
                                totalEarned: newTotal
                            });
                            
                            await updateLastSpinTime();
                            
                            userData.spinWallet = newBalance;
                            userData.totalEarned = newTotal;
                            
                            document.getElementById('spinWallet').innerText = newBalance;
                            showResult(`🎉 Congratulations! You won ${prize.value} RND! 🎉`, true);
                            
                            checkAndUpdateTimer();
                        } catch (error) {
                            console.error("Error updating balance:", error);
                            showResult(`❌ Error! Please try again.`, false);
                        }
                    } else {
                        await updateLastSpinTime();
                        showResult(`😢 Better luck next time! You got 0 RND.`, false);
                        checkAndUpdateTimer();
                    }
                    
                    spinBtn.disabled = false;
                    spinBtn.innerHTML = '<i class="fas fa-sync-alt"></i> SPIN AGAIN';
                    spinning = false;
                    
                    if (animationFrameId) {
                        cancelAnimationFrame(animationFrameId);
                        animationFrameId = null;
                    }
                }
            }
            
            animate();
        }
        
        // Attach event listener
        const spinBtn = document.getElementById('spinBtn');
        spinBtn.addEventListener('click', startSpin);
        
        window.goBack = function() {
            window.location.href = 'dashboard.html';
        };
        
        // Handle window resize
        window.addEventListener('resize', () => {
            if (ctx) {
                drawWheel(0);
            }
        });
    </script>
</body>
</html>
