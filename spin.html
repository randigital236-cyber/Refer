<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Spin Wheel - RND Rewards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .back-btn { background: rgba(255,255,255,0.2); border: none; color: white; padding: 10px 20px; border-radius: 50px; cursor: pointer; font-size: 14px; }
        .spin-card { background: white; border-radius: 40px; padding: 40px 30px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0,0,0,0.3); }
        .balance-badge { background: linear-gradient(135deg, #667eea20, #764ba220); padding: 10px 20px; border-radius: 50px; display: inline-block; margin-bottom: 20px; font-weight: 500; }
        .timer-badge { background: #fef3c7; padding: 10px 20px; border-radius: 50px; display: inline-block; margin-bottom: 15px; color: #92400e; font-size: 14px; }
        .wheel-container { margin: 30px 0; display: flex; justify-content: center; }
        .wheel { width: 280px; height: 280px; max-width: 100%; border-radius: 50%; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .spin-btn { background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; padding: 18px 50px; border-radius: 50px; font-size: 20px; font-weight: bold; cursor: pointer; transition: transform 0.2s; margin-top: 20px; }
        .spin-btn:active { transform: scale(0.95); }
        .spin-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .prize-list { margin-top: 30px; display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
        .prize-badge { background: #f3f4f6; padding: 8px 15px; border-radius: 50px; font-size: 12px; }
        .result { margin-top: 20px; padding: 15px; border-radius: 15px; font-weight: bold; animation: fadeIn 0.5s; }
        .result.win { background: #d1fae5; color: #059669; }
        .result.lose { background: #fee2e2; color: #dc2626; }
        .timer-text { font-size: 16px; font-weight: bold; color: #dc2626; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @media (max-width: 480px) { .wheel { width: 250px; height: 250px; } }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h2 style="color:white;"><i class="fas fa-gamepad"></i> Spin & Earn</h2>
            <button class="back-btn" onclick="goBack()"><i class="fas fa-arrow-left"></i> Back</button>
        </div>
        <div class="spin-card">
            <div class="balance-badge">
                <i class="fas fa-coins"></i> Your Spin Wallet: <strong id="spinWallet">0</strong> RND
            </div>
            <div id="timerBadge" class="timer-badge" style="display:none;">
                <i class="fas fa-hourglass-half"></i> Next Spin Available In: 
                <span id="countdownTimer" class="timer-text">--:--:--</span>
            </div>
            <div class="wheel-container">
                <canvas id="wheelCanvas" width="280" height="280" class="wheel"></canvas>
            </div>
            <button class="spin-btn" id="spinBtn">
                <i class="fas fa-sync-alt"></i> SPIN NOW
            </button>
            <div class="prize-list">
                <span class="prize-badge">🎁 0 RND</span>
                <span class="prize-badge">🎁 1 RND</span>
                <span class="prize-badge">🎁 2 RND</span>
                <span class="prize-badge">🎁 5 RND</span>
                <span class="prize-badge">🎁 10 RND</span>
            </div>
            <div id="resultMsg" class="result" style="display:none;"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
        
        const firebaseConfig = {
            apiKey: "AIzaSyARtuToUfDsK6EOrqpJ6nBpfSHx2JobWhQ",
            authDomain: "randigital-e7715.firebaseapp.com",
            databaseURL: "https://randigital-e7715-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "randigital-e7715",
            storageBucket: "randigital-e7715.firebasestorage.app",
            messagingSenderId: "218883279353",
            appId: "1:218883279353:web:cda990aa068f8fdf4d1528"
        };
        
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        let currentUser = null;
        let userData = null;
        let isSpinning = false;
        let timerInterval = null;
        
        // Prize segments
        const SEGMENTS = [
            { name: "1 RND", value: 1, color: "#FF6B6B" },
            { name: "2 RND", value: 2, color: "#4ECDC4" },
            { name: "0 RND", value: 0, color: "#FFEAA7" },
            { name: "5 RND", value: 5, color: "#45B7D1" },
            { name: "2 RND", value: 2, color: "#96CEB4" },
            { name: "10 RND", value: 10, color: "#DDA0DD" }
        ];
        
        const PI = Math.PI;
        const TAU = 2 * PI;
        const segmentAngle = TAU / SEGMENTS.length;
        
        let canvas = document.getElementById("wheelCanvas");
        let ctx = canvas.getContext("2d");
        let currentAngle = 0;
        
        // Draw wheel function
        function drawWheel() {
            const width = canvas.width;
            const height = canvas.height;
            const centerX = width / 2;
            const centerY = height / 2;
            const radius = width / 2 - 5;
            
            ctx.clearRect(0, 0, width, height);
            
            for (let i = 0; i < SEGMENTS.length; i++) {
                const start = i * segmentAngle + currentAngle;
                const end = start + segmentAngle;
                
                // Draw segment
                ctx.beginPath();
                ctx.moveTo(centerX, centerY);
                ctx.arc(centerX, centerY, radius, start, end);
                ctx.fillStyle = SEGMENTS[i].color;
                ctx.fill();
                ctx.strokeStyle = "white";
                ctx.lineWidth = 2;
                ctx.stroke();
                
                // Draw text
                ctx.save();
                ctx.translate(centerX, centerY);
                ctx.rotate(start + segmentAngle / 2);
                ctx.fillStyle = "#1f2937";
                ctx.font = "bold 14px Poppins";
                ctx.shadowBlur = 0;
                ctx.fillText(SEGMENTS[i].name, radius - 40, 8);
                ctx.restore();
            }
            
            // Draw center circle
            ctx.beginPath();
            ctx.arc(centerX, centerY, 20, 0, TAU);
            ctx.fillStyle = "white";
            ctx.fill();
            ctx.strokeStyle = "#667eea";
            ctx.lineWidth = 3;
            ctx.stroke();
            
            // Draw pointer
            ctx.beginPath();
            ctx.moveTo(centerX - 10, 12);
            ctx.lineTo(centerX, 2);
            ctx.lineTo(centerX + 10, 12);
            ctx.fillStyle = "#dc2626";
            ctx.fill();
        }
        
        // Initial draw
        drawWheel();
        
        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = "index.html";
                return;
            }
            currentUser = user;
            await loadUserData();
        });
        
        async function loadUserData() {
            const userRef = ref(db, "users/" + currentUser.uid);
            const snapshot = await get(userRef);
            userData = snapshot.val();
            if (!userData) {
                userData = { spinWallet: 0, totalEarned: 0, lastSpinTime: 0 };
            }
            if (userData.lastSpinTime === undefined) {
                userData.lastSpinTime = 0;
            }
            document.getElementById("spinWallet").innerText = userData.spinWallet || 0;
            checkTimer();
        }
        
        function checkTimer() {
            const lastSpin = userData.lastSpinTime || 0;
            const now = Date.now();
            const diff = now - lastSpin;
            const cooldown = 8 * 60 * 60 * 1000; // 8 hours
            
            if (lastSpin > 0 && diff < cooldown) {
                const remaining = cooldown - diff;
                startTimer(remaining);
                document.getElementById("spinBtn").disabled = true;
                document.getElementById("timerBadge").style.display = "inline-block";
            } else {
                if (timerInterval) clearInterval(timerInterval);
                document.getElementById("spinBtn").disabled = false;
                document.getElementById("timerBadge").style.display = "none";
            }
        }
        
        function startTimer(remainingMs) {
            if (timerInterval) clearInterval(timerInterval);
            
            let remaining = remainingMs;
            
            function updateTimer() {
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    document.getElementById("spinBtn").disabled = false;
                    document.getElementById("timerBadge").style.display = "none";
                    return;
                }
                
                const hours = Math.floor(remaining / (60 * 60 * 1000));
                const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
                const seconds = Math.floor((remaining % (60 * 1000)) / 1000);
                
                document.getElementById("countdownTimer").innerHTML = 
                    `${hours.toString().padStart(2, '0')}:${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                
                remaining -= 1000;
            }
            
            updateTimer();
            timerInterval = setInterval(updateTimer, 1000);
        }
        
        function showMessage(msg, isWin) {
            const resultDiv = document.getElementById("resultMsg");
            resultDiv.innerHTML = msg;
            resultDiv.className = isWin ? "result win" : "result lose";
            resultDiv.style.display = "block";
            setTimeout(() => {
                resultDiv.style.display = "none";
            }, 3000);
        }
        
        async function updateLastSpinTime() {
            await update(ref(db, "users/" + currentUser.uid), {
                lastSpinTime: Date.now()
            });
            userData.lastSpinTime = Date.now();
        }
        
        async function spinWheel() {
            if (isSpinning) return;
            
            // Check cooldown
            const lastSpin = userData.lastSpinTime || 0;
            const now = Date.now();
            const cooldown = 8 * 60 * 60 * 1000;
            
            if (lastSpin > 0 && (now - lastSpin) < cooldown) {
                const remaining = cooldown - (now - lastSpin);
                const hours = Math.floor(remaining / (60 * 60 * 1000));
                const minutes = Math.floor((remaining % (60 * 60 * 1000)) / (60 * 1000));
                const seconds = Math.floor((remaining % (60 * 1000)) / 1000);
                showMessage(`⏰ आप ${hours} घंटे ${minutes} मिनट ${seconds} सेकंड बाद ही दोबारा Spin कर सकते हैं!`, false);
                return;
            }
            
            isSpinning = true;
            const spinBtn = document.getElementById("spinBtn");
            spinBtn.disabled = true;
            spinBtn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Spinning...';
            
            // Random prize
            const randomIndex = Math.floor(Math.random() * SEGMENTS.length);
            const prize = SEGMENTS[randomIndex];
            
            // Calculate target angle
            const targetIndex = randomIndex;
            const targetAngle = (targetIndex * segmentAngle) + (segmentAngle / 2);
            
            // Animation
            const spinDuration = 2000;
            const startTime = Date.now();
            const startAngle = currentAngle;
            const fullRotations = 8 * TAU;
            const targetRotation = startAngle + fullRotations + targetAngle;
            
            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(1, elapsed / spinDuration);
                const easeOut = 1 - Math.pow(1 - progress, 3);
                
                currentAngle = startAngle + (targetRotation - startAngle) * easeOut;
                drawWheel();
                
                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    // Spin complete
                    currentAngle = targetRotation % TAU;
                    drawWheel();
                    
                    // Update balance
                    if (prize.value > 0) {
                        const newBalance = (userData.spinWallet || 0) + prize.value;
                        const newTotal = (userData.totalEarned || 0) + prize.value;
                        
                        update(ref(db, "users/" + currentUser.uid), {
                            spinWallet: newBalance,
                            totalEarned: newTotal
                        }).then(async () => {
                            userData.spinWallet = newBalance;
                            userData.totalEarned = newTotal;
                            document.getElementById("spinWallet").innerText = newBalance;
                            await updateLastSpinTime();
                            showMessage(`🎉 Congratulations! You won ${prize.value} RND! 🎉`, true);
                            checkTimer();
                            spinBtn.disabled = false;
                            spinBtn.innerHTML = '<i class="fas fa-sync-alt"></i> SPIN NOW';
                            isSpinning = false;
                        }).catch(err => {
                            console.error(err);
                            showMessage("❌ Error! Please try again.", false);
                            spinBtn.disabled = false;
                            spinBtn.innerHTML = '<i class="fas fa-sync-alt"></i> SPIN NOW';
                            isSpinning = false;
                        });
                    } else {
                        updateLastSpinTime().then(() => {
                            showMessage("😢 Better luck next time! You got 0 RND.", false);
                            checkTimer();
                            spinBtn.disabled = false;
                            spinBtn.innerHTML = '<i class="fas fa-sync-alt"></i> SPIN NOW';
                            isSpinning = false;
                        });
                    }
                }
            }
            
            animate();
        }
        
        // Event listener
        document.getElementById("spinBtn").addEventListener("click", spinWheel);
        
        window.goBack = function() {
            window.location.href = "dashboard.html";
        };
    </script>
</body>
</html>
