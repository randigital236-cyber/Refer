<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>RND Rewards - Earn Crypto</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
        body { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); min-height: 100vh; }
        .container { max-width: 500px; margin: 0 auto; padding: 20px; min-height: 100vh; display: flex; align-items: center; }
        .card { background: rgba(255,255,255,0.95); backdrop-filter: blur(10px); border-radius: 30px; padding: 40px 30px; width: 100%; animation: slideUp 0.5s ease; }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
        .logo { text-align: center; margin-bottom: 35px; }
        .logo h1 { font-size: 32px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .logo p { color: #6b7280; font-size: 14px; }
        .form-group { margin-bottom: 20px; position: relative; }
        .form-group i { position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #9ca3af; }
        .form-group input { width: 100%; padding: 14px 15px 14px 45px; border: 2px solid #e5e7eb; border-radius: 15px; font-size: 15px; }
        .form-group input:focus { outline: none; border-color: #667eea; }
        .btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #667eea, #764ba2); color: white; border: none; border-radius: 15px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .message { margin-top: 20px; padding: 12px; border-radius: 12px; text-align: center; font-size: 14px; }
        .error { background: #fee2e2; color: #dc2626; border-left: 4px solid #dc2626; }
        .success { background: #d1fae5; color: #059669; border-left: 4px solid #059669; }
        .info { background: #dbeafe; color: #2563eb; border-left: 4px solid #2563eb; }
        .link-text { text-align: center; margin-top: 25px; color: #6b7280; }
        .link-text a { color: #667eea; text-decoration: none; font-weight: 600; cursor: pointer; }
        @media (max-width: 480px) { .card { padding: 30px 20px; } .logo h1 { font-size: 28px; } }
    </style>
</head>
<body>
    <div class="container">
        <!-- Signup Card -->
        <div class="card" id="signupCard">
            <div class="logo">
                <i class="fas fa-coins" style="font-size: 50px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
                <h1>RND Rewards</h1>
                <p>Create Account & Start Earning</p>
            </div>
            <form id="signupForm">
                <div class="form-group"><i class="fas fa-user"></i><input type="text" id="name" placeholder="Full Name" required></div>
                <div class="form-group"><i class="fas fa-envelope"></i><input type="email" id="email" placeholder="Email Address" required></div>
                <div class="form-group"><i class="fas fa-lock"></i><input type="password" id="password" placeholder="Password (min 6 characters)" required></div>
                <div class="form-group"><i class="fas fa-gift"></i><input type="text" id="referralCode" placeholder="Referral Code (Optional)" autocomplete="off"></div>
                <button type="submit" class="btn"><i class="fas fa-rocket"></i> Create Account</button>
            </form>
            <div id="message" class="message"></div>
            <div class="link-text">Already have an account? <a onclick="showLogin()">Login Here</a></div>
        </div>

        <!-- Login Card -->
        <div class="card" id="loginCard" style="display:none;">
            <div class="logo">
                <i class="fas fa-coins" style="font-size: 50px; background: linear-gradient(135deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent;"></i>
                <h1>Welcome Back</h1>
                <p>Login to your account</p>
            </div>
            <form id="loginForm">
                <div class="form-group"><i class="fas fa-envelope"></i><input type="email" id="loginEmail" placeholder="Email Address" required></div>
                <div class="form-group"><i class="fas fa-lock"></i><input type="password" id="loginPassword" placeholder="Password" required></div>
                <button type="submit" class="btn"><i class="fas fa-arrow-right"></i> Login</button>
            </form>
            <div id="loginMessage" class="message"></div>
            <div class="link-text"><a onclick="showForgotPassword()">Forgot Password?</a></div>
            <div class="link-text">New user? <a onclick="showSignup()">Create Account</a></div>
        </div>

        <!-- Forgot Password Card -->
        <div class="card" id="forgotCard" style="display:none;">
            <div class="logo"><i class="fas fa-key" style="font-size: 50px;"></i><h1>Reset Password</h1><p>Enter your email to reset password</p></div>
            <form id="forgotForm">
                <div class="form-group"><i class="fas fa-envelope"></i><input type="email" id="forgotEmail" placeholder="Email Address" required></div>
                <button type="submit" class="btn"><i class="fas fa-paper-plane"></i> Send Reset Link</button>
            </form>
            <div id="forgotMessage" class="message"></div>
            <div class="link-text"><a onclick="showLogin()">Back to Login</a></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, sendEmailVerification, signOut, applyActionCode, checkActionCode, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, set, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARtuToUfDsK6EOrqpJ6nBpfSHx2JobWhQ",
            authDomain: "randigital-e7715.firebaseapp.com",
            databaseURL: "https://randigital-e7715-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "randigital-e7715",
            storageBucket: "randigital-e7715.firebasestorage.app",
            messagingSenderId: "218883279353",
            appId: "1:218883279353:web:cda990aa068f8fdf4d1528"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // 🔐 Handle Email Verification Link - Auto Login after verification
        async function handleEmailVerification() {
            try {
                // Check if there's a verification link in the URL
                if (window.location.href.includes('mode=verifyEmail')) {
                    // Get the action code from URL
                    const actionCode = new URLSearchParams(window.location.search).get('oobCode');
                    
                    if (actionCode) {
                        // Show loading message
                        document.body.innerHTML = `
                            <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #667eea, #764ba2); color: white; flex-direction: column;">
                                <i class="fas fa-spinner fa-spin" style="font-size: 50px; margin-bottom: 20px;"></i>
                                <h2>Verifying your email...</h2>
                                <p>Please wait, we are verifying your account.</p>
                            </div>
                        `;
                        
                        // Verify the email
                        await applyActionCode(auth, actionCode);
                        
                        // Get the user info from the action code
                        const actionCodeInfo = await checkActionCode(actionCode);
                        const email = actionCodeInfo.data.email;
                        
                        // Now sign in the user
                        const user = auth.currentUser;
                        if (user) {
                            // Reload user to get updated emailVerified status
                            await user.reload();
                            
                            if (user.emailVerified) {
                                // Update database emailVerified status
                                await update(ref(db, 'users/' + user.uid), { 
                                    emailVerified: true 
                                });
                                
                                // Store user data
                                const userSnapshot = await get(ref(db, 'users/' + user.uid));
                                const userData = userSnapshot.val();
                                
                                if (userData) {
                                    localStorage.setItem('userReferralCode', userData.referralCode);
                                    localStorage.setItem('userName', userData.name);
                                    localStorage.setItem('userId', user.uid);
                                    
                                    // Redirect to dashboard
                                    window.location.href = 'dashboard.html';
                                } else {
                                    window.location.href = 'dashboard.html';
                                }
                            } else {
                                window.location.href = 'index.html';
                            }
                        } else {
                            // Try to sign in with the email (user might need to login)
                            window.location.href = 'index.html?verified=true&email=' + encodeURIComponent(email);
                        }
                    }
                } else if (window.location.search.includes('verified=true')) {
                    // Show success message on index page
                    const email = new URLSearchParams(window.location.search).get('email');
                    const loginMessage = document.getElementById('loginMessage');
                    if (loginMessage) {
                        loginMessage.innerHTML = '<div class="success">✅ Email verified successfully! Please login with your credentials.</div>';
                    }
                    // Clean URL
                    window.history.replaceState({}, document.title, window.location.pathname);
                }
            } catch (error) {
                console.error("Verification error:", error);
                document.body.innerHTML = `
                    <div style="display: flex; justify-content: center; align-items: center; height: 100vh; background: linear-gradient(135deg, #667eea, #764ba2); color: white; flex-direction: column;">
                        <i class="fas fa-exclamation-triangle" style="font-size: 50px; margin-bottom: 20px;"></i>
                        <h2>Verification Failed</h2>
                        <p>${error.message}</p>
                        <button onclick="window.location.href='index.html'" style="margin-top: 20px; padding: 10px 30px; border-radius: 50px; border: none; cursor: pointer;">Go to Login</button>
                    </div>
                `;
            }
        }

        function getReferralCodeFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            return urlParams.get('ref');
        }

        function setReferralCodeFromURL() {
            const refCode = getReferralCodeFromURL();
            if (refCode) {
                const referralInput = document.getElementById('referralCode');
                if (referralInput) referralInput.value = refCode.toUpperCase();
            }
        }

        function generateReferralCode(userId) {
            return userId.substring(0, 8).toUpperCase();
        }

        async function saveUserToDatabase(user, name, referralCodeFromInput, isEmailVerified = false) {
            const userReferralCode = generateReferralCode(user.uid);
            let referredBy = null, level1Referrer = null, level2Referrer = null;
            
            if (referralCodeFromInput) {
                const usersRef = ref(db, 'users');
                const snapshot = await get(usersRef);
                const users = snapshot.val();
                if (users) {
                    for (let uid in users) {
                        if (users[uid].referralCode === referralCodeFromInput.toUpperCase()) {
                            referredBy = uid;
                            if (users[uid].referredBy) {
                                level1Referrer = users[uid].referredBy;
                                if (users[level1Referrer] && users[level1Referrer].referredBy)
                                    level2Referrer = users[level1Referrer].referredBy;
                            }
                            break;
                        }
                    }
                }
            }
            
            const userData = {
                name: name, email: user.email, userId: user.uid,
                referralCode: userReferralCode, referredBy: referredBy || null,
                referralWallet: referredBy ? 5 : 0, spinWallet: 0,
                totalEarned: referredBy ? 5 : 0, totalWithdrawn: 0,
                status: 'active', emailVerified: isEmailVerified,
                createdAt: new Date().toISOString(), socialTasks: {}
            };
            
            await set(ref(db, 'users/' + user.uid), userData);
            await set(ref(db, 'referrals/' + user.uid), { level1: [], level2: [] });
            
            if (referredBy) {
                const referrerRef = ref(db, 'users/' + referredBy);
                const referrerSnap = await get(referrerRef);
                if (referrerSnap.exists()) {
                    const referrer = referrerSnap.val();
                    await update(ref(db, 'users/' + referredBy), {
                        referralWallet: (referrer.referralWallet || 0) + 2,
                        totalEarned: (referrer.totalEarned || 0) + 2
                    });
                    const level1Ref = ref(db, 'referrals/' + referredBy + '/level1');
                    const level1Data = await get(level1Ref);
                    let level1List = level1Data.val() || [];
                    if (!level1List.includes(user.uid)) { level1List.push(user.uid); await set(level1Ref, level1List); }
                }
                if (level1Referrer) {
                    const level2UserRef = ref(db, 'users/' + level1Referrer);
                    const level2Snap = await get(level2UserRef);
                    if (level2Snap.exists()) {
                        const level2User = level2Snap.val();
                        await update(ref(db, 'users/' + level1Referrer), {
                            referralWallet: (level2User.referralWallet || 0) + 1,
                            totalEarned: (level2User.totalEarned || 0) + 1
                        });
                        const level2ListRef = ref(db, 'referrals/' + level1Referrer + '/level2');
                        const level2ListData = await get(level2ListRef);
                        let level2List = level2ListData.val() || [];
                        if (!level2List.includes(user.uid)) { level2List.push(user.uid); await set(level2ListRef, level2List); }
                    }
                }
            }
            return userReferralCode;
        }

        window.showLogin = function() {
            document.getElementById('signupCard').style.display = 'none';
            document.getElementById('loginCard').style.display = 'block';
            document.getElementById('forgotCard').style.display = 'none';
        }
        window.showSignup = function() {
            document.getElementById('signupCard').style.display = 'block';
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('forgotCard').style.display = 'none';
            setReferralCodeFromURL();
        }
        window.showForgotPassword = function() {
            document.getElementById('loginCard').style.display = 'none';
            document.getElementById('forgotCard').style.display = 'block';
        }
        setReferralCodeFromURL();

        // SIGNUP with Email Verification
        document.getElementById('signupForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const referralCode = document.getElementById('referralCode').value;
            const messageDiv = document.getElementById('message');

            if (password.length < 6) {
                messageDiv.innerHTML = '<div class="error">Password must be at least 6 characters!</div>';
                return;
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Send verification email
                await sendEmailVerification(user);
                
                // Save user data with emailVerified: false
                const userReferralCode = await saveUserToDatabase(user, name, referralCode, false);
                
                // Get the current domain for the verification link
                const actionCodeSettings = {
                    url: window.location.origin + window.location.pathname,
                    handleCodeInApp: true
                };
                
                messageDiv.innerHTML = `<div class="info"><i class="fas fa-envelope"></i> ✅ Verification email sent to ${email}!<br><br>Please check your inbox and click the verification link.<br>After verification, you will be automatically logged in.<br><br><strong>Your Referral Code: ${userReferralCode}</strong></div>`;
                
            } catch (error) {
                if (error.code === 'auth/email-already-in-use') {
                    messageDiv.innerHTML = '<div class="error">Email already registered! Please login.</div>';
                } else {
                    messageDiv.innerHTML = '<div class="error">' + error.message + '</div>';
                }
            }
        });
        
        // LOGIN with Email Verification Check
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const messageDiv = document.getElementById('loginMessage');
            
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                
                // Check if email is verified
                if (!user.emailVerified) {
                    await sendEmailVerification(user);
                    messageDiv.innerHTML = '<div class="error">❌ Email not verified! A new verification link has been sent to your email. Please check and verify.</div>';
                    return;
                }
                
                const userRef = ref(db, 'users/' + user.uid);
                const snapshot = await get(userRef);
                const userData = snapshot.val();
                
                if (userData && userData.status === 'active') {
                    localStorage.setItem('userReferralCode', userData.referralCode);
                    localStorage.setItem('userName', userData.name);
                    localStorage.setItem('userId', user.uid);
                    
                    messageDiv.innerHTML = '<div class="success">Login successful! Redirecting...</div>';
                    setTimeout(() => { window.location.href = 'dashboard.html'; }, 1000);
                } else {
                    messageDiv.innerHTML = '<div class="error">Account is blocked. Contact support.</div>';
                }
            } catch (error) {
                if (error.code === 'auth/user-not-found') {
                    messageDiv.innerHTML = '<div class="error">No account found. Please sign up.</div>';
                } else if (error.code === 'auth/wrong-password') {
                    messageDiv.innerHTML = '<div class="error">Wrong password. Try again.</div>';
                } else {
                    messageDiv.innerHTML = '<div class="error">' + error.message + '</div>';
                }
            }
        });
        
        // Forgot Password
        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('forgotEmail').value;
            const messageDiv = document.getElementById('forgotMessage');
            try {
                await sendPasswordResetEmail(auth, email);
                messageDiv.innerHTML = '<div class="success">Password reset email sent! Check your inbox.</div>';
                setTimeout(() => { showLogin(); }, 3000);
            } catch (error) {
                messageDiv.innerHTML = '<div class="error">' + error.message + '</div>';
            }
        });
        
        // Handle email verification on page load
        handleEmailVerification();
        
        // Auto sign out when tab closes (optional)
        window.addEventListener('beforeunload', async () => {
            // Optional: Keep user logged in
        });
    </script>
</body>
</html>
