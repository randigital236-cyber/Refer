<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Dashboard - RND Rewards</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px;
            padding-bottom: 80px;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .user-info {
            background: rgba(255,255,255,0.2);
            padding: 8px 15px;
            border-radius: 50px;
            color: white;
            font-size: 14px;
        }

        .logout-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 15px;
            border-radius: 50px;
            cursor: pointer;
        }

        /* Balance Cards */
        .balance-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 20px;
        }

        .balance-card {
            background: white;
            border-radius: 25px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.1);
        }

        .balance-card i {
            font-size: 30px;
            margin-bottom: 10px;
        }

        .balance-card .label {
            font-size: 12px;
            color: #6b7280;
        }

        .balance-card .amount {
            font-size: 24px;
            font-weight: bold;
            color: #1f2937;
        }

        /* Menu Grid */
        .menu-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .menu-item {
            background: white;
            border-radius: 20px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s;
            text-decoration: none;
            display: block;
        }

        .menu-item:active {
            transform: scale(0.95);
        }

        .menu-item i {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .menu-item .menu-title {
            font-weight: 600;
            color: #1f2937;
        }

        .menu-item .menu-desc {
            font-size: 11px;
            color: #6b7280;
        }

        /* Referral Section */
        .referral-section {
            background: white;
            border-radius: 25px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .referral-section h3 {
            margin-bottom: 15px;
            font-size: 18px;
        }

        .referral-link-box {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .referral-link-box input {
            flex: 1;
            padding: 12px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-size: 12px;
            background: #f9fafb;
        }

        .referral-link-box button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            text-align: center;
        }

        .stat-item .stat-value {
            font-size: 20px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-item .stat-label {
            font-size: 11px;
            color: #6b7280;
        }

        /* Bottom Nav */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            max-width: 500px;
            margin: 0 auto;
            background: white;
            display: flex;
            justify-content: space-around;
            padding: 12px 20px;
            border-radius: 30px 30px 0 0;
            box-shadow: 0 -5px 20px rgba(0,0,0,0.1);
        }

        .nav-item {
            text-align: center;
            cursor: pointer;
            color: #9ca3af;
            transition: color 0.2s;
        }

        .nav-item.active {
            color: #667eea;
        }

        .nav-item i {
            font-size: 22px;
        }

        .nav-item span {
            font-size: 10px;
            display: block;
        }

        /* Footer */
        .footer {
            text-align: center;
            color: rgba(255,255,255,0.7);
            font-size: 11px;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="user-info">
                <i class="fas fa-user-circle"></i> <span id="userName">User</span>
            </div>
            <button class="logout-btn" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> Logout
            </button>
        </div>

        <!-- Balance Cards -->
        <div class="balance-grid">
            <div class="balance-card">
                <i class="fas fa-wallet" style="color: #667eea;"></i>
                <div class="label">Referral Wallet</div>
                <div class="amount" id="referralBalance">0</div>
                <div class="label">RND</div>
            </div>
            <div class="balance-card">
                <i class="fas fa-gamepad" style="color: #764ba2;"></i>
                <div class="label">Spin Wallet</div>
                <div class="amount" id="spinBalance">0</div>
                <div class="label">RND</div>
            </div>
        </div>

        <!-- Menu Grid -->
        <div class="menu-grid">
            <div class="menu-item" onclick="goTo('spin.html')">
                <i class="fas fa-sync-alt" style="color: #f59e0b;"></i>
                <div class="menu-title">Spin Wheel</div>
                <div class="menu-desc">Earn up to 10 RND</div>
            </div>
            <div class="menu-item" onclick="goTo('social-tasks.html')">
                <i class="fab fa-facebook" style="color: #1877f2;"></i>
                <div class="menu-title">Social Tasks</div>
                <div class="menu-desc">Complete & Earn +3 RND</div>
            </div>
            <div class="menu-item" onclick="goTo('withdraw.html')">
                <i class="fas fa-hand-holding-usd" style="color: #10b981;"></i>
                <div class="menu-title">Withdraw</div>
                <div class="menu-desc">Withdraw your RND</div>
            </div>
            <div class="menu-item" onclick="showReferralModal()">
                <i class="fas fa-users" style="color: #8b5cf6;"></i>
                <div class="menu-title">Referral</div>
                <div class="menu-desc">Invite Friends & Earn</div>
            </div>
        </div>

        <!-- Referral Section -->
        <div class="referral-section">
            <h3><i class="fas fa-link"></i> Your Referral Link</h3>
            <div class="referral-link-box">
                <input type="text" id="referralLink" readonly>
                <button onclick="copyReferralLink()">
                    <i class="fas fa-copy"></i> Copy
                </button>
            </div>
            <div class="stats">
                <div class="stat-item">
                    <div class="stat-value" id="level1Count">0</div>
                    <div class="stat-label">Direct Referrals</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="level2Count">0</div>
                    <div class="stat-label">Indirect Referrals</div>
                </div>
                <div class="stat-item">
                    <div class="stat-value" id="totalEarned">0</div>
                    <div class="stat-label">Total Earned</div>
                </div>
            </div>
        </div>

        <div class="footer">
            <i class="fas fa-shield-alt"></i> Secure Platform | RND Rewards
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" onclick="goTo('dashboard.html')">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="goTo('withdraw.html')">
            <i class="fas fa-wallet"></i>
            <span>Withdraw</span>
        </div>
        <div class="nav-item" onclick="goTo('spin.html')">
            <i class="fas fa-gamepad"></i>
            <span>Spin</span>
        </div>
        <div class="nav-item" onclick="showReferralModal()">
            <i class="fas fa-users"></i>
            <span>Refer</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyARtuToUfDsK6EOrqpJ6nBpfSHx2JobWhQ",
            authDomain: "randigital-e7715.firebaseapp.com",
            databaseURL: "https://randigital-e7715-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "randigital-e7715",
            storageBucket: "randigital-e7715.firebasestorage.app",
            messagingSenderId: "218883279353",
            appId: "1:218883279353:web:cda990aa068f8fdf4d1528"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        
        let currentUser = null;
        let userData = null;
        
        // OFFICIAL DOMAIN - Change this to your actual domain
        const OFFICIAL_DOMAIN = "http://app.randigital.in";

        onAuthStateChanged(auth, async (user) => {
            if (!user) {
                window.location.href = 'index.html';
                return;
            }
            currentUser = user;
            document.getElementById('userName').innerText = localStorage.getItem('userName') || user.email.split('@')[0];
            await loadUserData();
        });

        async function loadUserData() {
            const userRef = ref(db, 'users/' + currentUser.uid);
            const snapshot = await get(userRef);
            userData = snapshot.val();
            
            if (userData) {
                document.getElementById('referralBalance').innerText = userData.referralWallet || 0;
                document.getElementById('spinBalance').innerText = userData.spinWallet || 0;
                document.getElementById('totalEarned').innerText = userData.totalEarned || 0;
                
                // Set referral link with official domain
                const referralLink = `${OFFICIAL_DOMAIN}/index.html?ref=${userData.referralCode}`;
                document.getElementById('referralLink').value = referralLink;
                
                await loadReferralCounts();
            }
        }

        async function loadReferralCounts() {
            const referralsRef = ref(db, 'referrals/' + currentUser.uid);
            const snapshot = await get(referralsRef);
            const referrals = snapshot.val();
            
            if (referrals) {
                document.getElementById('level1Count').innerText = (referrals.level1 || []).length;
                document.getElementById('level2Count').innerText = (referrals.level2 || []).length;
            }
        }

        window.copyReferralLink = function() {
            const linkInput = document.getElementById('referralLink');
            linkInput.select();
            document.execCommand('copy');
            
            // Show toast message
            const toast = document.createElement('div');
            toast.innerHTML = '<i class="fas fa-check-circle"></i> Referral link copied!';
            toast.style.position = 'fixed';
            toast.style.bottom = '100px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.background = '#10b981';
            toast.style.color = 'white';
            toast.style.padding = '12px 20px';
            toast.style.borderRadius = '50px';
            toast.style.zIndex = '1000';
            document.body.appendChild(toast);
            
            setTimeout(() => toast.remove(), 2000);
        }

        window.showReferralModal = function() {
            const link = document.getElementById('referralLink').value;
            alert(`Your Referral Link:\n${link}\n\nShare this link with friends. When they sign up, you will earn rewards!`);
        }

        window.goTo = function(page) {
            window.location.href = page;
        }

        window.logout = async function() {
            await signOut(auth);
            localStorage.clear();
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
